<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Sentiment Analysis</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        .recording {
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        .waveform {
            height: 100px;
            background: #f3f4f6;
            border-radius: 0.5rem;
            margin: 1rem 0;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- Sidebar -->
    <div class="fixed inset-y-0 left-0 w-64 bg-gray-800 text-white">
        <div class="flex items-center justify-center h-16 bg-gray-900">
            <h1 class="text-xl font-bold">Sentiment Analyzer</h1>
        </div>
        <nav class="mt-6">
            <div class="px-4 space-y-2">
                <a href="index.html" class="block px-4 py-2 text-gray-100 bg-gray-700 rounded-lg">
                    Record Audio
                </a>
                <a href="upload.php" class="block px-4 py-2 text-gray-300 hover:bg-gray-700 rounded-lg">
                    Upload Audio
                </a>
                <a href="text.php" class="block px-4 py-2 text-gray-300 hover:bg-gray-700 rounded-lg">
                    Text Analysis
                </a>
                <a href="history.php" class="block px-4 py-2 text-gray-300 hover:bg-gray-700 rounded-lg">
                    History
                </a>
                <a href="settings.php" class="block px-4 py-2 text-gray-300 hover:bg-gray-700 rounded-lg">
                    Settings
                </a>
            </div>
        </nav>
    </div>

    <!-- Main Content -->
    <div class="ml-64 p-8">
        <div class="max-w-2xl mx-auto bg-white rounded-lg shadow-lg p-6">
            <h1 class="text-2xl font-bold mb-6 text-center">Record Audio</h1>
            
            <!-- Language Selection -->
            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="language">
                    Select Language
                </label>
                <select id="language" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="en">English</option>
                    <option value="es">Spanish</option>
                    <option value="fr">French</option>
                    <option value="de">German</option>
                    <option value="it">Italian</option>
                    <option value="pt">Portuguese</option>
                    <option value="nl">Dutch</option>
                    <option value="ja">Japanese</option>
                    <option value="ko">Korean</option>
                    <option value="zh">Chinese</option>
                </select>
            </div>

            <!-- Audio Controls -->
            <div class="mb-6">
                <div class="flex justify-center space-x-4">
                    <button id="startRecording" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-lg">
                        Start Recording
                    </button>
                    <button id="stopRecording" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg" disabled>
                        Stop Recording
                    </button>
                </div>
            </div>

            <!-- Recording Status -->
            <div id="recordingStatus" class="hidden mb-6">
                <div class="flex items-center justify-center">
                    <div class="w-3 h-3 bg-red-500 rounded-full mr-2 recording"></div>
                    <span class="text-red-500 font-semibold">Recording...</span>
                </div>
            </div>

            <!-- Audio Waveform -->
            <div class="waveform mb-6">
                <canvas id="waveform"></canvas>
            </div>

            <!-- Recording Time -->
            <div class="text-center mb-6">
                <span id="recordingTime" class="text-2xl font-mono">00:00</span>
            </div>

            <!-- Results -->
            <div id="result" class="mt-6 p-4 bg-gray-50 rounded-lg"></div>
        </div>
    </div>

    <script>
        let mediaRecorder;
        let audioChunks = [];
        let startTime;
        let timerInterval;
        let audioContext;
        let analyser;
        let canvasContext;
        let animationId;

        // Initialize audio context and canvas
        function initAudioContext() {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 2048;
            
            const canvas = document.getElementById('waveform');
            canvasContext = canvas.getContext('2d');
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        }

        // Draw waveform
        function drawWaveform() {
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            
            function draw() {
                animationId = requestAnimationFrame(draw);
                analyser.getByteTimeDomainData(dataArray);
                
                canvasContext.fillStyle = '#f3f4f6';
                canvasContext.fillRect(0, 0, canvasContext.canvas.width, canvasContext.canvas.height);
                
                canvasContext.lineWidth = 2;
                canvasContext.strokeStyle = '#3b82f6';
                canvasContext.beginPath();
                
                const sliceWidth = canvasContext.canvas.width * 1.0 / bufferLength;
                let x = 0;
                
                for(let i = 0; i < bufferLength; i++) {
                    const v = dataArray[i] / 128.0;
                    const y = v * canvasContext.canvas.height / 2;
                    
                    if(i === 0) {
                        canvasContext.moveTo(x, y);
                    } else {
                        canvasContext.lineTo(x, y);
                    }
                    
                    x += sliceWidth;
                }
                
                canvasContext.lineTo(canvasContext.canvas.width, canvasContext.canvas.height/2);
                canvasContext.stroke();
            }
            
            draw();
        }

        // Update recording time
        function updateTimer() {
            const currentTime = Date.now();
            const elapsedTime = Math.floor((currentTime - startTime) / 1000);
            const minutes = Math.floor(elapsedTime / 60).toString().padStart(2, '0');
            const seconds = (elapsedTime % 60).toString().padStart(2, '0');
            document.getElementById('recordingTime').textContent = `${minutes}:${seconds}`;
        }

        // Start recording
        document.getElementById('startRecording').addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                initAudioContext();
                
                const source = audioContext.createMediaStreamSource(stream);
                source.connect(analyser);
                
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                
                mediaRecorder.ondataavailable = (event) => {
                    audioChunks.push(event.data);
                };
                
                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                    const formData = new FormData();
                    formData.append('audio', audioBlob);
                    formData.append('language', document.getElementById('language').value);

                    document.getElementById('result').textContent = 'Processing audio...';
                    document.getElementById('recordingStatus').classList.add('hidden');

                    try {
                        const response = await fetch('handle_upload.php', {
                            method: 'POST',
                            body: formData
                        });

                        const data = await response.json();
                        if (data.success) {
                            document.getElementById('result').innerHTML = `
                                <div class="mb-4">
                                    <h3 class="font-bold text-lg">Transcription:</h3>
                                    <p class="text-gray-700">${data.transcription}</p>
                                </div>
                                <div>
                                    <h3 class="font-bold text-lg">Sentiment:</h3>
                                    <p class="text-${data.sentiment === 'positive' ? 'green' : data.sentiment === 'negative' ? 'red' : 'yellow'}-600">
                                        ${data.sentiment}
                                    </p>
                                </div>
                            `;
                        } else {
                            document.getElementById('result').textContent = `Error: ${data.error}`;
                        }
                    } catch (error) {
                        document.getElementById('result').textContent = `Error processing audio: ${error.message}`;
                    }

                    // Stop waveform animation
                    cancelAnimationFrame(animationId);
                };
                
                mediaRecorder.start();
                startTime = Date.now();
                timerInterval = setInterval(updateTimer, 1000);
                
                document.getElementById('startRecording').disabled = true;
                document.getElementById('stopRecording').disabled = false;
                document.getElementById('recordingStatus').classList.remove('hidden');
                
                drawWaveform();
            } catch (error) {
                document.getElementById('result').textContent = `Error: ${error.message}`;
            }
        });

        // Stop recording
        document.getElementById('stopRecording').addEventListener('click', () => {
            mediaRecorder.stop();
            clearInterval(timerInterval);
            
            document.getElementById('startRecording').disabled = false;
            document.getElementById('stopRecording').disabled = true;
            document.getElementById('recordingStatus').classList.add('hidden');
        });
    </script>
</body>
</html>
